name: Build & Release RBZ

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # нужно для создания GitHub Release

jobs:
  release:
    # windows-latest: детерминированное окружение сборки; сам ZIP пишет
    # чистый Ruby (build/package.rb, stdlib zlib) — bsdtar (`tar -a`) не
    # использовать: его ZIP SketchUp 2026 отклоняет при установке.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Package RBZ
        run: ruby build/package.rb

      - name: Build release body
        run: ruby build/release_body.rb

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/dn1sup_export_3d.rbz
          body_path: release_body.md
          generate_release_notes: true
